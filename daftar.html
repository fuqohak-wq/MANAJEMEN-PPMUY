<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pendaftaran Wajah Santri</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl text-center">
        <h1 class="text-sm font-black text-indigo-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-user-plus mr-1"></i> Registrasi Kunci Wajah</h1>
        <p class="text-[10px] text-slate-400 mb-4">Pastikan wajah menghadap lampu terang saat memotret</p>

        <div class="space-y-2 mb-4 text-left">
            <div>
                <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Nomor Induk / NIK</label>
                <input type="number" id="reg-nik" placeholder="Contoh: 2024001" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-white outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Nama Lengkap</label>
                <input type="text" id="reg-nama" placeholder="Contoh: Ahmad Fauzi" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-white outline-none focus:border-indigo-500">
            </div>
        </div>

        <div class="relative w-full aspect-square bg-black rounded-2xl overflow-hidden border border-slate-800 mb-4">
            <video id="video-daftar" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
            <canvas id="canvas-daftar" class="hidden"></canvas>
            <div id="flash" class="absolute inset-0 bg-white opacity-0 transition-opacity duration-100 pointer-events-none"></div>
        </div>

        <button id="btn-jepret" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider shadow-lg transition-colors cursor-pointer">
            <i class="fa-solid fa-camera mr-1"></i> Ambil & Kunci Wajah
        </button>

        <p id="status-reg" class="text-[10px] mt-3 text-slate-400 font-medium"></p>
        
        <div class="mt-4 pt-3 border-t border-slate-800 text-center">
            <a href="index.html" class="text-[10px] font-bold text-emerald-400 hover:underline">&larr; Kembali ke Mesin Absensi</a>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        let video = document.getElementById('video-daftar');
        let statusReg = document.getElementById('status-reg');
        let btnJepret = document.getElementById('btn-jepret');

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
            } catch (e) {
                statusReg.innerText = "Kamera tidak bisa diakses.";
                statusReg.className = "text-[10px] mt-3 text-red-400 font-bold";
            }
        });

        btnJepret.addEventListener('click', async () => {
            let nik = document.getElementById('reg-nik').value.trim();
            let nama = document.getElementById('reg-nama').value.trim();

            if (!nik || !nama) {
                alert("Mohon isi NIK dan Nama terlebih dahulu!");
                return;
            }

            btnJepret.disabled = true;
            statusReg.innerText = "Sedang mendaftarkan wajah ke Cloud...";
            statusReg.className = "text-[10px] mt-3 text-amber-400 font-bold animate-pulse";

            const f = document.getElementById('flash'); f.classList.remove('opacity-0'); f.classList.add('opacity-100');
            setTimeout(() => { f.classList.remove('opacity-100'); f.classList.add('opacity-0'); }, 80);

            const canvas = document.getElementById('canvas-daftar');
            
            // RESOLUSI STABIL Ringan (320x240)
            canvas.width = 320; 
            canvas.height = 240;
            canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
            
            // Kompresi dioptimasi ke 30% (0.3) agar payload data teks sangat aman di Google
            const base64Image = canvas.toDataURL('image/jpeg', 0.3).split(',')[1];

            const formPayload = new URLSearchParams();
            formPayload.append('aksi', 'daftar');
            formPayload.append('nik', nik);
            formPayload.append('nama', nama);
            formPayload.append('imageBlob', base64Image);

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formPayload.toString()
                });
                const r = await res.json();

                if (r.status === "success") {
                    statusReg.innerText = r.message;
                    statusReg.className = "text-[10px] mt-3 text-emerald-400 font-bold";
                    document.getElementById('reg-nik').value = "";
                    document.getElementById('reg-nama').value = "";
                } else {
                    statusReg.innerText = r.message || "Gagal mendaftar.";
                    statusReg.className = "text-[10px] mt-3 text-red-400 font-bold";
                }
            } catch (e) {
                statusReg.innerText = "Server Google Menolak Akses / Terjadi Error.";
                statusReg.className = "text-[10px] mt-3 text-red-400 font-bold";
            } finally {
                btnJepret.disabled = false;
            }
        });
    </script>
</body>
</html>
