<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Presensi Wajah Pesantren</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 text-center">
        <div>
            <h1 class="text-xl font-black text-cyan-400 uppercase tracking-wider">🟢 KIOSK PRESENSI LIVE VERCEL</h1>
            <p id="info-status" class="text-xs text-amber-400 mt-1 animate-pulse font-bold">Sinkronisasi Realtime Google Sheet...</p>
        </div>

        <div class="relative bg-black rounded-2xl overflow-hidden aspect-video w-full border border-slate-800 flex items-center justify-center">
            <video id="video-kamera" autoplay muted playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
            <div id="loading-overlay" class="absolute inset-0 bg-slate-950/80 flex items-center justify-center text-xs font-bold tracking-widest text-slate-400 animate-pulse">
                MEMBUAT CAMERA ENGINE...
            </div>
            <div class="absolute inset-12 border-2 border-dashed border-cyan-500/30 rounded-2xl pointer-events-none animate-pulse"></div>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-left">
            <label class="text-[10px] font-black text-slate-500 tracking-widest block uppercase mb-1">Status Kiosk:</label>
            <div id="log-absen" class="font-mono text-sm font-bold text-cyan-400 text-center py-2">
                Menghubungkan jaringan cloud...
            </div>
        </div>
        
        <div class="pt-2">
            <a href="scan-santri.html" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black py-4 rounded-2xl text-xs uppercase text-center block tracking-widest shadow-lg transition-all"><i class="fa-solid fa-camera mr-1"></i> MASUK MODE LIVE SCAN WAJAH AI</a>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        const video = document.getElementById('video-kamera');
        const infoStatus = document.getElementById('info-status');
        const logAbsen = document.getElementById('log-absen');
        const overlay = document.getElementById('loading-overlay');
        
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                let res = await fetch(`${API_URL}?aksi=ambil_database`, { method: "GET" });
                let json = await res.json();
                
                if (json.status === "success" && json.data.length > 0) {
                    infoStatus.innerText = `🟢 KIOSK ONLINE (DATABASE: ${json.data.length} SANTRI)`;
                    infoStatus.className = "text-xs text-emerald-400 mt-1 font-bold tracking-wide";
                    startKamera();
                } else {
                    throw new Error("Data master kosong.");
                }
            } catch (e) {
                infoStatus.innerText = "🔴 ERROR INTEGRASI: Gagal Tarik Data";
                infoStatus.className = "text-xs text-red-500 mt-1 font-bold";
                logAbsen.innerText = "Gagal terhubung ke Google Sheet. Periksa kembali Deployment Web App Anda.";
                logAbsen.className = "text-red-500 font-bold text-center text-xs";
            }
        });

        function startKamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    video.srcObject = stream;
                    overlay.classList.add('hidden');
                    logAbsen.innerText = "Sistem Siap. Silakan klik tombol Live Scan di atas.";
                    logAbsen.className = "text-emerald-400 text-xs font-bold text-center";
                })
                .catch(err => {
                    overlay.innerText = "AKSES KAMERA DITOLAK ATAU TIDAK DITEMUKAN!";
                    overlay.className = "absolute inset-0 bg-red-950/90 text-red-400 flex items-center justify-center text-xs font-bold p-4";
                });
        }
    </script>
</body>
</html>
