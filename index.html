<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Absensi AI Lokal v3.2 - Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Mengunci layar HP agar tidak bisa di-scroll berantakan dan terasa seperti App asli */
        body { touch-action: manipulation; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between p-4 selection:bg-cyan-500/30">

    <!-- HEADER UTAMA (Lebih Besar & Jelas) -->
    <div class="w-full max-w-md mx-auto bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-sm font-black text-cyan-400 uppercase tracking-wider"><i class="fa-solid fa-bolt mr-1"></i> SCAN ABSENSI</h1>
            <p id="txt-db-status" class="text-[11px] text-amber-400 font-bold animate-pulse mt-0.5">Sinkronisasi Database...</p>
        </div>
        <!-- Dropdown diperbesar agar mudah ditekan jempol -->
        <select id="waktu-shalat" class="bg-slate-950 border-2 border-slate-700 rounded-xl px-3 py-2 text-xs font-black text-white outline-none focus:border-cyan-500 cursor-pointer">
            <option value="Subuh">Subuh</option>
            <option value="Dhuhur">Dhuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Maghrib">Maghrib</option>
            <option value="Isya'">Isya'</option>
        </select>
    </div>

    <!-- AREA KAMERA (Memenuhi layar HP dengan proporsional) -->
    <div class="w-full max-w-md mx-auto my-auto py-4 flex flex-col justify-center items-center">
        <div class="relative w-full aspect-square bg-slate-900 border-2 border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex items-center justify-center">
            
            <!-- Video Kamera Full Screen di dalam Box -->
            <video id="video-selfie" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
            
            <!-- Overlay Scanner yang Elegan -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="kotak-scan" class="w-64 h-64 border-4 border-dashed border-cyan-500/40 rounded-3xl flex items-center justify-center transition-all duration-300">
                    <span id="instruksi" class="text-xs bg-slate-950/90 text-cyan-400 px-4 py-2 rounded-xl font-black uppercase tracking-widest border border-cyan-500/30 shadow-2xl text-center backdrop-blur-sm">Memuat AI...</span>
                </div>
            </div>
            
            <!-- Efek Flash -->
            <div id="flash" class="absolute inset-0 bg-white opacity-0 transition-opacity duration-100 pointer-events-none"></div>
        </div>
    </div>

    <!-- FOOTER NAVIGASI (Tombol diposisikan di bawah dekat jempol) -->
    <div class="w-full max-w-md mx-auto flex flex-col gap-3">
        <a href="daftar.html" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider text-center shadow-md transition-all active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-plus text-indigo-400 text-sm"></i> Belum Daftar Wajah? Klik di Sini
        </a>
    </div>

    <!-- POPUP NOTIFIKASI BERHASIL (Besar, Jelas, Menutupi Layar Tengah HP) -->
    <div id="pop-success" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 hidden z-50 animate-fade-in">
        <div class="bg-emerald-500 text-slate-950 w-full max-w-sm p-6 rounded-3xl text-center shadow-2xl border-2 border-emerald-400">
            <div class="w-16 h-16 bg-slate-950 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-check text-emerald-400 text-2xl animate-bounce"></i>
            </div>
            <span class="text-xs font-black tracking-widest block opacity-75 uppercase">🔊 ABSENSI BERHASIL</span>
            <span class="font-black text-xl block mt-1 tracking-wide" id="txt-nama-sukses">Nama Santri</span>
            <div class="mt-4 text-[11px] font-bold bg-slate-950/10 py-1.5 rounded-xl">Data masuk ke Google Sheets!</div>
        </div>
    </div>

    <!-- POPUP NOTIFIKASI GAGAL -->
    <div id="pop-failed" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 hidden z-50">
        <div class="bg-red-500 text-white w-full max-w-sm p-6 rounded-3xl text-center shadow-2xl border-2 border-red-400">
            <div class="w-16 h-16 bg-slate-950 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-xmark text-red-500 text-2xl"></i>
            </div>
            <span class="text-xs font-black tracking-widest block opacity-75 uppercase">❌ ABSENSI GAGAL</span>
            <span class="font-black text-sm block mt-1" id="txt-failed-reason">Wajah Tidak Dikenal</span>
        </div>
    </div>

    <!-- AUDIO BEEP GENERATOR -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function bunyiBeepBerhasil() {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = "sine"; osc.frequency.value = 1100; gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e){}
        }
        // Aktifkan Audio lewat ketukan pertama di layar HP
        document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
    </script>

    <!-- SCRIPT UTAMA PERFORMA HP -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        let video = document.getElementById('video-selfie');
        let label = document.getElementById('instruksi');
        let kotakScan = document.getElementById('kotak-scan');
        let dbStatus = document.getElementById('txt-db-status');
        
        let isProcessing = false;
        let databaseSantri = []; 

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Konfigurasi performa ringan khusus HP
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights');
                await faceapi.nets.faceLandmark68Net.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights');
                
                label.innerText = "MENGUNDUH DATA...";
                
                const formPayload = new URLSearchParams();
                formPayload.append('aksi', 'ambil_database');

                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formPayload.toString()
                });
                const json = await res.json();
                
                if (json.status === "success") {
                    databaseSantri = json.data;
                    dbStatus.innerText = `🟢 Database Ready: ${databaseSantri.length} Santri`;
                    dbStatus.className = "text-[11px] text-emerald-400 font-bold";
                }

                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                
                label.innerText = "HADAPKAN WAJAH";
                label.className = "text-xs bg-slate-950/90 text-cyan-400 px-4 py-2 rounded-xl font-black uppercase tracking-widest border border-cyan-500/30 shadow-2xl";
                
                mulaiKioskScanLokal();
            } catch (e) {
                label.innerText = "KAMERA ERROR";
                label.className = "text-xs bg-red-600 text-white px-4 py-2 rounded-xl font-bold";
            }
        });

        function mulaiKioskScanLokal() {
            setInterval(async () => {
                if (isProcessing || video.paused || video.ended || databaseSantri.length === 0) return;

                // Ukuran input disesuaikan ke 128 agar HP kentang sekalipun tetap lancar jaya
                const hasilKamera = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 128, scoreThreshold: 0.4 })).withFaceLandmarks();

                if (hasilKamera) {
                    isProcessing = true; 
                    kotakScan.className = "w-64 h-64 border-4 border-solid border-emerald-400 rounded-3xl flex items-center justify-center bg-emerald-500/10 scale-105";
                    label.innerText = "MEMVERIFIKASI...";
                    label.className = "text-xs bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl font-black uppercase tracking-widest shadow-2xl";
                    
                    verifikasiWajahLokal(hasilKamera.landmarks.positions);
                } else {
                    kotakScan.className = "w-64 h-64 border-4 border-dashed border-cyan-500/30 rounded-3xl flex items-center justify-center";
                    label.innerText = "HADAPKAN WAJAH";
                    label.className = "text-xs bg-slate-950/90 text-cyan-400 px-4 py-2 rounded-xl font-black uppercase tracking-widest border border-cyan-500/30 shadow-2xl";
                }
            }, 400);
        }

        async function verifikasiWajahLokal(posisiKamera) {
            let santriDitemukan = null;
            let skorTerbaik = 999;

            for (let santri of databaseSantri) {
                try {
                    let posisiMaster = JSON.parse(santri.vektor);
                    let jarak = hitungJarakMatematika(posisiKamera, posisiMaster);

                    if (jarak < skorTerbaik && jarak < 15.0) { 
                        skorTerbaik = jarak;
                        santriDitemukan = santri;
                    }
                } catch(err){}
            }

            if (santriDitemukan) {
                bunyiBeepBerhasil();
                const f = document.getElementById('flash'); f.classList.remove('opacity-0'); f.classList.add('opacity-100');
                setTimeout(() => { f.classList.remove('opacity-100'); f.classList.add('opacity-0'); }, 80);

                document.getElementById('txt-nama-sukses').innerText = santriDitemukan.nama;
                document.getElementById('pop-success').classList.remove('hidden');

                const waktu = document.getElementById('waktu-shalat').value;
                const formPayload = new URLSearchParams();
                formPayload.append('aksi', 'absen');
                formPayload.append('nik', santriDitemukan.nik);
                formPayload.append('nama', santriDitemukan.nama);
                formPayload.append('waktuShalat', waktu);

                try {
                    await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formPayload.toString() });
                } catch(e){}

                setTimeout(() => {
                    document.getElementById('pop-success').classList.add('hidden');
                    isProcessing = false; 
                }, 3000);

            } else {
                document.getElementById('pop-failed').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('pop-failed').classList.add('hidden');
                    isProcessing = false; 
                }, 2000);
            }
        }

        function hitungJarakMatematika(titik1, titik2) {
            let totalJarak = 0;
            let jumlah = Math.min(titik1.length, titik2.length);
            for (let i = 0; i < jumlah; i++) {
                totalJarak = totalJarak + Math.pow(titik1[i]._x - titik2[i]._x, 2) + Math.pow(titik1[i]._y - titik2[i]._y, 2);
            }
            return Math.sqrt(totalJarak) / jumlah;
        }
    </script>
</body>
</html>
