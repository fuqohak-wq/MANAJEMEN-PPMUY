<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AI Absensi - Mode Simulasi Lokal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex flex-col min-h-screen justify-between p-4">

    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-md max-w-sm mx-auto w-full">
        <div>
            <h1 class="text-xs font-black text-amber-400 uppercase tracking-wide"><i class="fa-solid fa-laptop-code mr-1"></i> SIMULASI LOKAL PC</h1>
            <p class="text-[9px] text-slate-400">Kamera aktif 100% bebas dari gembok Google</p>
        </div>
        <select id="waktu-shalat" class="bg-slate-950 border border-slate-700 rounded-xl px-2 py-1 text-[11px] text-slate-200 font-bold outline-none">
            <option value="Subuh">Subuh</option>
            <option value="Dhuhur">Dhuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Maghrib">Maghrib</option>
            <option value="Isya'">Isya'</option>
        </select>
    </div>

    <div class="max-w-sm w-full mx-auto my-4 bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl text-center relative">
        <div class="relative w-full aspect-square bg-black rounded-2xl overflow-hidden border border-slate-800 mb-2">
            <video id="video-selfie" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
            <canvas id="canvas-capture" class="hidden"></canvas>
            
            <div class="absolute inset-0 border-[20px] border-slate-950/60 flex items-center justify-center pointer-events-none">
                <div class="w-full h-full border-2 border-dashed border-emerald-500/40 rounded-full flex items-center justify-center">
                    <span id="instruksi" class="text-[9px] bg-slate-950 text-emerald-400 px-3 py-1.5 rounded-xl font-bold uppercase tracking-wider shadow-md">Membuka Kamera...</span>
                </div>
            </div>
            <div id="flash" class="absolute inset-0 bg-white opacity-0 transition-opacity duration-100 pointer-events-none"></div>
        </div>
    </div>

    <div id="pop-success" class="max-w-sm w-full mx-auto bg-emerald-600 text-slate-950 p-4 rounded-2xl text-center hidden shadow-xl">
        <span class="text-[10px] font-black tracking-widest block opacity-80">🔊 BERHASIL TERABSEN</span>
        <span class="font-black text-sm block mt-0.5" id="txt-nama">Nama Santri</span>
    </div>

    <div id="pop-failed" class="max-w-sm w-full mx-auto bg-red-600 text-white p-3 rounded-2xl text-center hidden text-[11px] font-bold">
        Wajah tidak cocok / Tidak Terdaftar.
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function bunyiBeep() {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = "sine"; osc.frequency.value = 1400; gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    </script>

    <script>
        // =========================================================================
        // PENTING: Ganti URL di bawah ini dengan URL TEST DEPLOYMENT (/dev) Anda!
        // =========================================================================
        const API_URL = "https://script.google.com/macros/s/AKfycbyPOOQTpOw-muXgSmLJqGwiT4woU-Bhc5W6SnZm4xI/dev";
        
        let video = document.getElementById('video-selfie');
        let label = document.getElementById('instruksi');
        let isProcessing = false;
        let lastFrameData = null;
        let motionCounter = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                label.innerText = "SIAP! HADAPKAN KE WAJAH";
                label.className = "text-[9px] bg-slate-950 text-emerald-400 px-3 py-1.5 rounded-xl font-bold uppercase tracking-wider";
                mulaiPantauGerakanPiksel();
            } catch (e) {
                label.innerText = "GAGAL MEMBUAT JALUR KAMERA";
                console.error(e);
            }
        });

        function mulaiPantauGerakanPiksel() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            setInterval(() => {
                if (isProcessing || video.paused || video.ended) return;

                canvas.width = 40; canvas.height = 40;
                ctx.drawImage(video, 0, 0, 40, 40);
                const frameData = ctx.getImageData(0, 0, 40, 40).data;

                if (lastFrameData) {
                    let totalPerubahan = 0;
                    for (let i = 0; i < frameData.length; i += 4) {
                        totalPerubahan += Math.abs(frameData[i] - lastFrameData[i]);
                        totalPerubahan += Math.abs(frameData[i+1] - lastFrameData[i+1]);
                        totalPerubahan += Math.abs(frameData[i+2] - lastFrameData[i+2]);
                    }

                    if (totalPerubahan > 12000) { 
                        motionCounter++;
                        label.innerText = `MENGUNCI WAJAH... (${motionCounter}/2)`;
                        label.className = "text-[9px] bg-indigo-600 text-white px-3 py-1.5 rounded-xl font-bold uppercase tracking-wider";

                        if (motionCounter >= 2) {
                            motionCounter = 0;
                            isProcessing = true;
                            jepretDanKirimCloud();
                        }
                    } else {
                        if (motionCounter > 0) motionCounter--;
                        label.innerText = "SIAP! HADAPKAN KE WAJAH";
                        label.className = "text-[9px] bg-slate-950 text-emerald-400 px-3 py-1.5 rounded-xl font-bold uppercase tracking-wider";
                    }
                }
                lastFrameData = frameData;
            }, 700);
        }

        async function jepretDanKirimCloud() {
            label.innerText = "MEMPROSES AI CLOUD...";
            label.className = "text-[9px] bg-amber-500 text-slate-950 px-3 py-1.5 rounded-xl font-bold uppercase tracking-wider animate-pulse";

            const f = document.getElementById('flash'); f.classList.remove('opacity-0'); f.classList.add('opacity-100');
            setTimeout(() => { f.classList.remove('opacity-100'); f.classList.add('opacity-0'); }, 80);

            const realCanvas = document.getElementById('canvas-capture');
            realCanvas.width = video.videoWidth || 640; 
            realCanvas.height = video.videoHeight || 480;
            realCanvas.getContext('2d').drawImage(video, 0, 0, realCanvas.width, realCanvas.height);
            const base64Image = realCanvas.toDataURL('image/jpeg', 0.6);

            const waktu = document.getElementById('waktu-shalat').value;

            try {
                // Menembak langsung ke Web App Google Apps Script dari file lokal laptop
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "prosesCloudAbsen", imageBlob: base64Image, waktuShalat: waktu })
                });
                const r = await res.json();

                if (r.status === "success") {
                    bunyiBeep();
                    document.getElementById('txt-nama').innerText = r.nama;
                    
                    const popSuccess = document.getElementById('pop-success');
                    popSuccess.classList.remove('hidden');

                    setTimeout(() => {
                        popSuccess.classList.add('hidden');
                        lastFrameData = null;
                        isProcessing = false;
                    }, 4000);
                } else {
                    const popFail = document.getElementById('pop-failed');
                    popFail.classList.remove('hidden');
                    setTimeout(() => {
                        popFail.classList.add('hidden');
                        lastFrameData = null;
                        isProcessing = false;
                    }, 2000);
                }
            } catch (e) {
                lastFrameData = null;
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
