<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kiosk Absensi AI Lokal v3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans flex flex-col min-h-screen justify-between p-4">

    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-md max-w-sm mx-auto w-full">
        <div>
            <h1 class="text-xs font-black text-cyan-400 uppercase tracking-wide"><i class="fa-solid fa-bolt mr-1"></i> KIOSK ABSENSI LOKAL V3</h1>
            <p id="txt-db-status" class="text-[9px] text-amber-400 font-bold animate-pulse">Menghubungkan ke Database Cloud...</p>
        </div>
        <select id="waktu-shalat" class="bg-slate-950 border border-slate-700 rounded-xl px-2 py-1 text-[11px] text-slate-200 font-bold outline-none">
            <option value="Subuh">Subuh</option>
            <option value="Dhuhur">Dhuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Maghrib">Maghrib</option>
            <option value="Isya'">Isya'</option>
        </select>
    </div>

    <div class="max-w-sm w-full mx-auto my-4 bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-2xl text-center relative">
        <div class="relative w-full aspect-square bg-black rounded-2xl overflow-hidden border border-slate-800 mb-2 flex items-center justify-center">
            <video id="video-selfie" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
            
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="kotak-scan" class="w-48 h-48 border-4 border-dashed border-cyan-500/30 rounded-3xl flex items-center justify-center transition-all">
                    <span id="instruksi" class="text-[9px] bg-slate-950 text-cyan-400 px-3 py-1.5 rounded-xl font-black uppercase tracking-wider shadow-md">Loading Engine...</span>
                </div>
            </div>
            <div id="flash" class="absolute inset-0 bg-white opacity-0 transition-opacity duration-100 pointer-events-none"></div>
        </div>
        
        <div class="text-center mt-2">
            <a href="daftar.html" class="text-[10px] font-bold text-indigo-400 hover:underline"><i class="fa-solid fa-user-plus mr-1"></i> Belum Daftar Wajah? Klik di Sini</a>
        </div>
    </div>

    <div id="pop-success" class="max-w-sm w-full mx-auto bg-emerald-600 text-slate-950 p-4 rounded-2xl text-center hidden shadow-xl">
        <span class="text-[10px] font-black tracking-widest block opacity-80">🔊 BERHASIL TERABSEN</span>
        <span class="font-black text-sm block mt-0.5" id="txt-nama-sukses">Nama Santri</span>
        <span class="text-[10px] font-bold block mt-1">Silakan bergantian dengan santri berikutnya &rarr;</span>
    </div>

    <div id="pop-failed" class="max-w-sm w-full mx-auto bg-red-600 text-white p-4 rounded-2xl text-center hidden shadow-xl">
        <span class="text-[10px] font-black tracking-widest block opacity-80">❌ ABSENSI GAGAL</span>
        <span class="font-bold text-xs block mt-0.5" id="txt-failed-reason">Wajah Tidak Dikenal.</span>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        
        let video = document.getElementById('video-selfie');
        let label = document.getElementById('instruksi');
        let kotakScan = document.getElementById('kotak-scan');
        let dbStatus = document.getElementById('txt-db-status');
        
        let isProcessing = false;
        let databaseSantri = []; // Menyimpan lokal memory database koordinat santri

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Unduh model AI lokal ke browser Kiosk
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights');
                await faceapi.nets.faceLandmark68Net.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights');
                
                label.innerText = "MENGUNDUH DATA MASTER...";
                
                // 2. Tarik data koordinat dari Google Sheets ke lokal memory Kiosk
                const res = await fetch(`${API_URL}?aksi=ambil_database`);
                const json = await res.json();
                
                if (json.status === "success") {
                    databaseSantri = json.data;
                    dbStatus.innerText = `Database Aktif: ${databaseSantri.length} Santri Terkunci`;
                    dbStatus.className = "text-[9px] text-emerald-400 font-bold";
                }

                // 3. Hidupkan kamera
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                
                label.innerText = "HADAPKAN WAJAH";
                label.className = "text-[9px] bg-slate-950 text-cyan-400 px-3 py-1.5 rounded-xl font-black uppercase tracking-wider shadow-md";
                
                // Jalankan mesin scan otomatis berkala
                mulaiKioskScanLokal();
            } catch (e) {
                label.innerText = "GAGAL START KIOSK";
                label.className = "text-[9px] bg-red-600 text-white px-3 py-1.5 rounded-xl font-bold";
            }
        });

        function mulaiKioskScanLokal() {
            setInterval(async () => {
                if (isProcessing || video.paused || video.ended || databaseSantri.length === 0) return;

                // Membaca wajah yang sedang berdiri di depan kamera secara instan
                const hasilKamera = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 128, scoreThreshold: 0.5 })).withFaceLandmarks();

                if (hasilKamera) {
                    kotakScan.className = "w-48 h-48 border-4 border-solid border-emerald-400 rounded-3xl flex items-center justify-center bg-emerald-500/10 scale-105";
                    label.innerText = "MENCOCOKKAN...";
                    label.className = "text-[9px] bg-emerald-500 text-slate-950 px-3 py-1.5 rounded-xl font-black uppercase tracking-wider";
                    
                    isProcessing = true;
                    verifikasiWajahLokal(hasilKamera.landmarks.positions);
                } else {
                    kotakScan.className = "w-48 h-48 border-4 border-dashed border-cyan-500/30 rounded-3xl flex items-center justify-center";
                    label.innerText = "HADAPKAN WAJAH";
                    label.className = "text-[9px] bg-slate-950 text-cyan-400 px-3 py-1.5 rounded-xl font-black uppercase tracking-wider shadow-md";
                }
            }, 450);
        }

        async function verifikasiWajahLokal(posisiKamera) {
            let santriDitemukan = null;
            let skorTerbaik = 999;

            // Membandingkan data secara instan langsung di memori perangkat (Bebas lemot!)
            for (let santri of databaseSantri) {
                try {
                    let posisiMaster = JSON.parse(santri.vektor);
                    let jarak = hitungJarakMatematika(posisiKamera, posisiMaster);

                    if (jarak < skorTerbaik && jarak < 10.5) { // Batas toleransi kemiripan struktur wajah
                        skorTerbaik = jarak;
                        santriDitemukan = santri;
                    }
                } catch(err){}
            }

            if (santriDitemukan) {
                // Efek Flash sukses jepret
                const f = document.getElementById('flash'); f.classList.remove('opacity-0'); f.classList.add('opacity-100');
                setTimeout(() => { f.classList.remove('opacity-100'); f.classList.add('opacity-0'); }, 80);

                document.getElementById('txt-nama-sukses').innerText = santriDitemukan.nama;
                document.getElementById('pop-success').classList.remove('hidden');

                // Kirim laporan kehadiran ke Google Sheet (Sangat ringan karena hanya kirim teks NIK & Nama)
                const waktu = document.getElementById('waktu-shalat').value;
                const formPayload = new URLSearchParams();
                formPayload.append('aksi', 'absen');
                formPayload.append('nik', santriDitemukan.nik);
                formPayload.append('nama', santriDitemukan.nama);
                formPayload.append('waktuShalat', waktu);

                try {
                    await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: formPayload.toString() });
                } catch(e){}

                setTimeout(() => {
                    document.getElementById('pop-success').classList.add('hidden');
                    isProcessing = false;
                }, 3000);

            } else {
                document.getElementById('pop-failed').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('pop-failed').classList.add('hidden');
                    isProcessing = false;
                }, 2500);
            }
        }

        // Rumus hitung selisih jarak Euclidean koordinat wajah lokal
        function hitungJarakMatematika(titik1, titik2) {
            let totalJarak = 0;
            let jumlah = Math.min(titik1.length, titik2.length);
            for (let i = 0; i < jumlah; i++) {
                totalJarcak = totalJarak + Math.pow(titik1[i]._x - titik2[i]._x, 2) + Math.pow(titik1[i]._y - titik2[i]._y, 2);
            }
            return Math.sqrt(totalJarak) / jumlah;
        }
    </script>
</body>
</html>
