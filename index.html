<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Manajemen Absensi Pesantren v4.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { touch-action: manipulation; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col justify-start items-center">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl text-center space-y-6 my-auto">
        <div>
            <h1 class="text-base font-black text-cyan-400 tracking-wider uppercase"><i class="fa-solid fa-hotel mr-1"></i> DASHBOARD ABSENSI</h1>
            <p class="text-[11px] text-slate-400 font-medium mt-1">Silakan pilih jenis pintu masuk absensi</p>
        </div>

        <div class="space-y-3 text-left">
            <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest block pl-1">Pintu Gerbang Santri</span>
            <a href="scan-santri.html" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 font-black py-4 rounded-2xl text-xs uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all text-center">
                <i class="fa-solid fa-face-recognition text-sm"></i> Buka Kiosk Wajah Santri
            </a>
            <a href="daftar.html" class="w-full bg-slate-950 border-2 border-slate-800 hover:border-slate-700 font-bold py-3 rounded-2xl text-[11px] uppercase tracking-wider flex items-center justify-center gap-2 text-slate-400 active:scale-95 transition-all text-center">
                <i class="fa-solid fa-user-plus text-indigo-400"></i> Registrasi Anggota Baru
            </a>
        </div>

        <hr class="border-slate-800">

        <div id="box-login-admin" class="space-y-3 text-left">
            <span class="text-[10px] font-black text-amber-500 uppercase tracking-widest block pl-1"><i class="fa-solid fa-lock mr-1"></i> Khusus Kepala Pondok</span>
            <input type="text" id="adm-user" placeholder="Username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs font-bold outline-none focus:border-amber-500">
            <input type="password" id="adm-pass" placeholder="Password Akun" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs font-bold outline-none focus:border-amber-500">
            <button id="btn-login-admin" class="w-full bg-amber-600 font-black py-3 rounded-2xl text-xs text-slate-950 uppercase tracking-widest active:scale-95 transition-all">
                Masuk Panel Manual
            </button>
        </div>

        <div id="box-panel-admin" class="space-y-4 text-left hidden">
            <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-amber-500/20">
                <span class="text-xs font-black text-amber-400"><i class="fa-solid fa-user-shield mr-1"></i> KEPALA PONDOK</span>
                <button onclick="window.location.reload()" class="text-[10px] bg-red-600 px-2 py-1 font-bold rounded-lg text-white">Keluar</button>
            </div>

            <div class="space-y-3">
                <label class="text-[10px] font-black text-slate-400 uppercase">1. Pilih Kelompok & Kegiatan</label>
                <select id="adm-kegiatan" onchange="cekOpsiKelas()" class="w-full bg-slate-950 border-2 border-slate-800 rounded-xl px-3 py-3 text-xs font-black text-white outline-none cursor-pointer">
                    <option value="USTADZ|Jamaah Subuh">Ustadz - Bakdo Subuh</option>
                    <option value="USTADZ|Jamaah Magrib">Ustadz - Bakdo Magrib</option>
                    <option value="GURU_PDF|Sekolah PDF Jam 1">Guru PDF - Jam Ke 1</option>
                    <option value="GURU_PDF|Sekolah PDF Jam 2">Guru PDF - Jam Ke 2</option>
                    <option value="GURU_PDF|Sekolah PDF Jam 3">Guru PDF - Jam Ke 3</option>
                    <option value="SANTRI|Sekolah PDF Jam 1">Santri PDF - Jam Ke 1 (Per Kelas)</option>
                    <option value="SANTRI|Sekolah PDF Jam 2">Santri PDF - Jam Ke 2 (Per Kelas)</option>
                    <option value="SANTRI|Sekolah PDF Jam 3">Santri PDF - Jam Ke 3 (Per Kelas)</option>
                </select>

                <div id="box-pilih-kelas" class="space-y-1 hidden">
                    <label class="text-[10px] font-black text-indigo-400 uppercase">2. Tentukan Kelas Murid</label>
                    <select id="adm-kelas" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs font-bold text-white outline-none">
                        <option value="1A">Kelas 1A</option>
                        <option value="1B">Kelas 1B</option>
                        <option value="2A">Kelas 2A</option>
                        <option value="2B">Kelas 2B</option>
                        <option value="3A">Kelas 3A</option>
                    </select>
                </div>

                <button id="btn-muat-manual" class="w-full bg-indigo-600 font-bold py-3 rounded-xl text-xs uppercase tracking-wide">Tampilkan Daftar Nama</button>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-slate-400 uppercase block">3. Ketuk Nama Hadir (Klik Langsung Hilang)</label>
                <div id="list-nama-manual" class="bg-slate-950 border border-slate-800 rounded-2xl p-2 min-h-[150px] max-h-[250px] overflow-y-auto space-y-1.5">
                    <p class="text-[11px] text-slate-600 text-center py-12">Belum ada data dimuat.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        
        function cekOpsiKelas() {
            let selectVal = document.getElementById('adm-kegiatan').value.split('|');
            let tipe = selectVal[0];
            let boxKelas = document.getElementById('box-pilih-kelas');
            if(tipe === "SANTRI") {
                boxKelas.classList.remove('hidden');
            } else {
                boxKelas.classList.add('hidden');
            }
        }

        document.getElementById('btn-login-admin').addEventListener('click', async () => {
            let u = document.getElementById('adm-user').value;
            let p = document.getElementById('adm-pass').value;
            const fp = new URLSearchParams();
            fp.append('aksi', 'login_admin');
            fp.append('username', u);
            fp.append('password', p);

            const res = await fetch(API_URL, { method: "POST", body: fp.toString() });
            const r = await res.json();
            if(r.status === "success") {
                document.getElementById('box-login-admin').classList.add('hidden');
                document.getElementById('box-panel-admin').classList.remove('hidden');
            } else { alert(r.message); }
        });

        document.getElementById('btn-muat-manual').addEventListener('click', async () => {
            let selectVal = document.getElementById('adm-kegiatan').value.split('|');
            let tipe = selectVal[0];
            let kegiatan = selectVal[1];
            let kelas = document.getElementById('adm-kelas').value;
            let container = document.getElementById('list-nama-manual');
            
            container.innerHTML = '<p class="text-[11px] text-amber-400 text-center py-12 animate-pulse">Menarik data dari Google Sheet...</p>';

            const fp = new URLSearchParams();
            fp.append('aksi', 'ambil_list_manual');
            fp.append('tipe', tipe);
            fp.append('kegiatan', kegiatan);
            fp.append('kelas', kelas);

            const res = await fetch(API_URL, { method: "POST", body: fp.toString() });
            const r = await res.json();
            
            if(r.status === "success" && r.data.length > 0) {
                container.innerHTML = "";
                r.data.forEach(item => {
                    let btn = document.createElement('button');
                    btn.className = "w-full text-left bg-slate-900 border border-slate-800 hover:bg-emerald-950 hover:border-emerald-500 p-3 rounded-xl text-xs font-bold transition-all flex justify-between items-center group";
                    btn.innerHTML = `<span>${item.nama}</span> <span class="text-[9px] text-slate-500 group-hover:text-emerald-400 font-normal">TAP ABSEN &rarr;</span>`;
                    
                    btn.onclick = async () => {
                        btn.style.opacity = "0.3"; btn.disabled = true;
                        const fpAbsen = new URLSearchParams();
                        fpAbsen.append('aksi', 'absen');
                        fpAbsen.append('nik', item.nik);
                        fpAbsen.append('nama', item.nama);
                        fpAbsen.append('kegiatan', kegiatan);
                        fpAbsen.append('petugas', "KEPALA_PONDOK_MANUAL");

                        try {
                            let resA = await fetch(API_URL, { method: "POST", body: fpAbsen.toString() });
                            let rA = await resA.json();
                            if(rA.status === "success" || rA.status === "terabsen") {
                                btn.remove();
                                if(container.children.length === 0) {
                                    container.innerHTML = '<p class="text-[11px] text-emerald-400 text-center py-12">🎉 Semua anggota kelompok terabsen!</p>';
                                }
                            } else { alert(rA.message); btn.style.opacity = "1"; btn.disabled = false; }
                        } catch(e) { btn.style.opacity = "1"; btn.disabled = false; }
                    };
                    container.appendChild(btn);
                });
            } else {
                container.innerHTML = '<p class="text-[11px] text-slate-500 text-center py-12">Tidak ada anggota tersisa yang belum absen.</p>';
            }
        });
    </script>
</body>
</html>
