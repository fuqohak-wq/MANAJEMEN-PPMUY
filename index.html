<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Pesantren Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .premium-bg {
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.08), transparent),
                        radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.08), transparent),
                        #030712;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="premium-bg text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Kontainer Box Utama -->
    <div class="w-full max-w-md glass-panel rounded-3xl p-8 shadow-2xl relative overflow-hidden transition-all duration-500 hover:border-slate-800/80">
        
        <!-- Pendaran Cahaya Mewah -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Judul & Status Cloud -->
        <div class="text-center space-y-2 mb-8">
            <div class="inline-flex items-center gap-2 bg-slate-950/60 px-4 py-1.5 rounded-full border border-slate-800">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="dot-status"></span>
                <span class="text-[10px] font-black tracking-widest text-slate-400 uppercase" id="lbl-status">Sinkronisasi Cloud...</span>
            </div>
            <h1 class="text-2xl font-black bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent tracking-wide">E-PESANTREN</h1>
            <p class="text-xs text-slate-400 font-medium">Sistem Integrasi Manajemen Hak Akses Kiosk</p>
        </div>

        <!-- Form Login Akses Pengurus -->
        <form id="form-login" class="space-y-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 tracking-widest block uppercase mb-1.5">Username Pengurus</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-circle-user absolute left-4 text-slate-500 text-sm"></i>
                    <input type="text" id="username" placeholder="Ketik username..." class="w-full bg-slate-950/60 border border-slate-800 focus:border-cyan-500/50 rounded-2xl pl-11 pr-4 py-3.5 text-xs font-bold text-white outline-none transition-all" required>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-400 tracking-widest block uppercase mb-1.5">Password / PIN Keamanan</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-shield-keyhole absolute left-4 text-slate-500 text-sm"></i>
                    <input type="password" id="password" placeholder="Masukkan PIN..." class="w-full bg-slate-950/60 border border-slate-800 focus:border-cyan-500/50 rounded-2xl pl-11 pr-4 py-3.5 text-xs font-bold text-white outline-none transition-all" required>
                </div>
            </div>

            <button type="submit" id="btn-submit-login" class="w-full bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 font-black py-4 rounded-2xl text-xs uppercase tracking-widest font-sans shadow-lg shadow-cyan-500/10 active:scale-[0.98] transition-all cursor-pointer pt-4">
                AUTHENTICATE ACCESS <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
            </button>
        </form>

        <!-- Informasi Footer -->
        <p class="text-center text-[10px] text-slate-600 font-bold tracking-wider mt-8 uppercase">Gate System Security Verified</p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        
        // Cek koneksi database saat halaman dibuka
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                let res = await fetch(`${API_URL}?aksi=ambil_database`, { method: "GET" });
                let json = await res.json();
                if (json.status === "success") {
                    document.getElementById('dot-status').className = "w-2 h-2 rounded-full bg-emerald-500";
                    document.getElementById('lbl-status').innerText = `SYSTEM ONLINE: ${json.data.length} SANTRI READY`;
                }
            } catch(e) {
                document.getElementById('dot-status').className = "w-2 h-2 rounded-full bg-red-500 animate-none";
                document.getElementById('lbl-status').innerText = "CLOUD DATABASE DISCONNECTED";
            }
        });

        // Handler Proses Pengiriman Data Login
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-login');
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            btn.disabled = true;
            btn.innerText = "VERIFYING CREDENTIALS...";

            const fd = new URLSearchParams();
            fd.append('aksi', 'login_admin');
            fd.append('username', u);
            fd.append('password', p);

            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: fd.toString()
                });
                let r = await res.json();

                if (r.status === "success") {
                    // Menyimpan data sesi login secara aman di lokal storage browser
                    localStorage.setItem('session_nama', r.nama);
                    localStorage.setItem('session_role', r.role);
                    localStorage.setItem('session_kelas_ajar', r.kelasAjar);
                    
                    // Alihkan ke Dashboard Baru
                    window.location.href = "dashboard.html";
                } else {
                    alert("Gagal Akses: " + r.message);
                    btn.disabled = false;
                    btn.innerText = "AUTHENTICATE ACCESS";
                }
            } catch(err) {
                alert("Gangguan internet menuju Google Cloud Server!");
                btn.disabled = false;
                btn.innerText = "AUTHENTICATE ACCESS";
            }
        });
    </script>
</body>
</html>
