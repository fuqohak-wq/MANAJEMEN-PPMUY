<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosk Wajah Santri Fleksibel - Integrated Guard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { touch-action: manipulation; overflow: hidden; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4">

  <div class="w-full max-w-md mx-auto bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col gap-2 shadow-lg">
    <div class="flex justify-between items-center">
      <h1 class="text-xs font-black text-cyan-400 uppercase tracking-wider"><i class="fa-solid fa-face-viewfinder mr-1"></i> PRESENSI KIOSK AI</h1>
      <p id="txt-db-status" class="text-[11px] text-amber-400 font-bold animate-pulse">Sinkronisasi Basis Data...</p>
    </div>
    
    <select id="pilihan-kegiatan" class="w-full bg-slate-950 border-2 border-slate-700 rounded-xl px-3 py-3 text-xs font-black text-white outline-none focus:border-cyan-500 cursor-pointer">
      <option value="Shalat Jamaah Subuh">Murni - Shalat Jamaah Subuh</option>
      <option value="Ngaji al-Qur'an bakdo Subuh">Ngaji al-Qur'an bakdo Subuh</option>
      <option value="Ngafsahi / Kursus">Ngafsahi / Kursus bakdo Ngaji</option>
      <option value="Sekolah PDF Jam 1">Sekolah PDF - Jam Ke 1</option>
      <option value="Sekolah PDF Jam 2">Sekolah PDF - Jam Ke 2</option>
      <option value="Sekolah PDF Jam 3">Sekolah PDF - Jam Ke 3</option>
      <option value="Shalat Jamaah Maghrib">Murni - Shalat Jamaah Maghrib</option>
      <option value="Musyawarah bakdo Magrib">Musyawarah bakdo Magrib</option>
      <option value="Ngaji Kitab Bakdo Musyawarah">Ngaji Kitab Bakdo Musyawarah</option>
      <option value="Shalat Jamaah Isya'">Murni - Shalat Jamaah Isya'</option>
      <option value="Jam Belajar Bakdo Isyak">Jam Belajar Bakdo Isyak</option>
      <option value="Piket Kebersihan">Piket Kebersihan Sesuai Jadwal</option>
    </select>
  </div>

  <div class="w-full max-w-md mx-auto my-auto flex flex-col justify-center items-center">
    <div class="relative w-full aspect-square bg-slate-900 border-2 border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
      <video id="video-selfie" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div id="kotak-scan" class="w-64 h-64 border-4 border-dashed border-cyan-500/40 rounded-3xl flex items-center justify-center transition-all duration-300">
          <span id="instruksi" class="text-xs bg-slate-950/90 text-cyan-400 px-4 py-2 rounded-xl font-black uppercase tracking-widest border border-cyan-500/30 shadow-2xl">Memuat AI...</span>
        </div>
      </div>
    </div>
  </div>

  <div class="w-full max-w-md mx-auto">
    <a href="dashboard.html" class="w-full bg-slate-900 text-slate-400 font-bold py-3.5 rounded-2xl text-xs uppercase text-center block tracking-wider"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Dashboard</a>
  </div>

  <div id="pop-success" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 hidden z-50">
    <div class="bg-emerald-500 text-slate-950 w-full max-w-sm p-6 rounded-3xl text-center shadow-2xl border-2 border-emerald-400">
      <div class="w-16 h-16 bg-slate-950 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-check text-emerald-400 text-2xl"></i></div>
      <span class="text-xs font-black tracking-widest block opacity-75">🔊 PRESENSI DIKONFIRMASI</span>
      <span class="font-black text-xl block mt-1 tracking-wide" id="txt-nama-sukses">Nama Santri</span>
    </div>
  </div>

  <div id="pop-failed" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 hidden z-50">
    <div class="bg-red-500 text-white w-full max-w-sm p-6 rounded-3xl text-center shadow-2xl border-2 border-red-400">
      <div class="w-16 h-16 bg-slate-950 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-xmark text-white text-2xl"></i></div>
      <span class="text-xs font-black tracking-widest block opacity-75" id="title-gagal">❌ ABSENSI GAGAL</span>
      <span class="font-black text-sm block mt-1" id="txt-failed-reason">Wajah Tidak Dikenal</span>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
    let video = document.getElementById('video-selfie');
    let label = document.getElementById('instruksi');
    let kotakScan = document.getElementById('kotak-scan');
    let dbStatus = document.getElementById('txt-db-status');
    let isProcessing = false; 
    let databaseSantri = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function bunyiBeep(freq = 1100) {
      try {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.value = freq; gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch(e){}
    }
    document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://unpkg.com/@vladmandic/face-api/model');
        await faceapi.nets.faceLandmark68Net.loadFromUri('https://unpkg.com/@vladmandic/face-api/model');

        const res = await fetch(`${API_URL}?aksi=ambil_database`, { method: "GET" });
        const json = await res.json();
        if (json.status === "success") {
          databaseSantri = json.data;
          dbStatus.innerText = `🟢 ${databaseSantri.length} Santri Cloud Ready`;
          dbStatus.className = "text-[11px] text-emerald-400 font-bold";
        }
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = stream;
        label.innerText = "POSISIKAN WAJAH ANDA";
        mulaiKioskScanLokal();
      } catch (e) { 
        label.innerText = "ENGINE CRASH / OFFLINE";
      }
    });

    function mulaiKioskScanLokal() {
      setInterval(async () => {
        if (isProcessing || video.paused || video.ended || databaseSantri.length === 0) return;
        const hasilKamera = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 128, scoreThreshold: 0.4 })).withFaceLandmarks();
        if (hasilKamera) {
          isProcessing = true;
          kotakScan.className = "w-64 h-64 border-4 border-solid border-emerald-400 rounded-3xl flex items-center justify-center bg-emerald-500/10 scale-105";
          label.innerText = "IDENTIFIKASI...";
          verifikasiWajahLokal(hasilKamera.landmarks.positions);
        }
      }, 400);
    }

    async function verifikasiWajahLokal(posisiKamera) {
      let santriDitemukan = null;
      let skorTerbaik = 999;

      for (let santri of databaseSantri) {
        try {
          // Normalisasi pembacaan properti 'vektor' atau 'vektorWajah' dari Apps Script
          let dataVektor = santri.vektor || santri.vektorWajah;
          if(!dataVektor) continue;
          
          let jarak = hitungJarakMatematika(posisiKamera, JSON.parse(dataVektor));
          if (jarak < skorTerbaik && jarak < 15.0) { 
            skorTerbaik = jarak; santriDitemukan = santri;
          }
        } catch(e){}
      }

      if (santriDitemukan) {
        const kegiatan = document.getElementById('pilihan-kegiatan').value;
        const fp = new URLSearchParams();
        fp.append('aksi', 'absen');
        fp.append('nik', santriDitemukan.nik);
        fp.append('kegiatan', kegiatan);
        fp.append('petugas', "KIOSK_AI_LIVE");

        try {
          let res = await fetch(API_URL, { 
            method: "POST", 
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: fp.toString() 
          });
          let r = await res.json();
          if(r.status === "success") {
            bunyiBeep(1100);
            document.getElementById('txt-nama-sukses').innerText = santriDitemukan.nama;
            document.getElementById('pop-success').classList.remove('hidden');
            setTimeout(() => { resetKioskScan(); }, 3000);
          } else {
            bunyiBeep(400);
            document.getElementById('title-gagal').innerText = "❌ SISTEM MENOLAK";
            document.getElementById('txt-failed-reason').innerText = r.message;
            document.getElementById('pop-failed').classList.remove('hidden');
            setTimeout(() => { resetKioskScan(); }, 3500);
          }
        } catch(e) { resetKioskScan(); }
      } else {
        bunyiBeep(400);
        document.getElementById('title-gagal').innerText = "❌ IDENTIFIKASI GAGAL";
        document.getElementById('txt-failed-reason').innerText = "Data geometri wajah tidak cocok dengan santri manapun.";
        document.getElementById('pop-failed').classList.remove('hidden');
        setTimeout(() => { resetKioskScan(); }, 2000);
      }
    }

    function resetKioskScan() {
      document.getElementById('pop-success').classList.add('hidden');
      document.getElementById('pop-failed').classList.add('hidden');
      isProcessing = false; 
      label.innerText = "POSISIKAN WAJAH ANDA"; 
      kotakScan.className = "w-64 h-64 border-4 border-dashed border-cyan-500/40 rounded-3xl flex items-center justify-center";
    }

    function hitungJarakMatematika(titik1, titik2) {
      let totalJarak = 0;
      let jumlah = Math.min(titik1.length, titik2.length);
      for (let i = 0; i < jumlah; i++) {
        totalJarak = totalJarak + Math.pow(titik1[i]._x - titik2[i]._x, 2) + Math.pow(titik1[i]._y - titik2[i]._y, 2);
      }
      return Math.sqrt(totalJarak) / jumlah;
    }
  </script>
</body>
</html>
